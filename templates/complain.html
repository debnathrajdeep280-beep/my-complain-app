<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharatiya Shikayat Darj Desk</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 20px; }
        .container { max-width: 450px; background: white; padding: 25px; margin: auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #128c7e; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #128c7e; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #075e54; }
    </style>
</head>
<body>

<div class="container">
    <h2>Shikayat Panjikaran (India Only)</h2>
    <form action="/register" method="POST">
        <input type="text" name="name" placeholder="Apna Asali Naam" required>
        <input type="tel" name="phone" placeholder="10-Digit Mobile Number" pattern="[0-9]{10}" required>
        
        <input type="email" name="email" placeholder="Apni Email ID (e.g. name@gmail.com)" required>
        
        <select name="state" required>
            <option value="">-- Apna Rajya (State) Chunein --</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Delhi">Delhi</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
        </select>

        <input type="text" name="district" placeholder="Apna Zila (District)" required>
        <input type="text" name="address" placeholder="Poora Pata (House No, Gali, Area)" required>
        <input type="text" name="pincode" placeholder="6-Digit PIN Code" pattern="[0-9]{6}" required>
        
        <input type="password" name="password" placeholder="Apna Password Banayein" required>
        
        <button type="submit">Register & Login Karein</button>
    </form>
</div>

</body>
          </html>
